repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system
        pass_filenames: false

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: ^\.secrets\.baseline$

  - repo: local
    hooks:
      - id: repository-docs
        name: Generate and verify repository docs
        entry: uv run python scripts/hooks/pre-commit-docs.py
        language: system
        pass_filenames: false
        always_run: true

[project]
name = "stock-skills"
version = "0.1.0"
description = "Natural-language-first stock screening and investment analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "certifi>=2026.10.23",
    "networkx>=3.0",
    "numpy>=1.24.0",
    "pandas>=1.5.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "requests>=2.31.0",
    "yfinance>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[tool.uv]
package = false
